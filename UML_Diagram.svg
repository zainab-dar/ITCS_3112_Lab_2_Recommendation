<text x="340" y="498" font-size="11" fill="#999" text-anchor="middle">— Repositories —</text>

<!-- BookRepository -->
<rect x="20" y="510" width="148" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
