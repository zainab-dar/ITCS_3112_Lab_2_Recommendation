<text x="194" y="582" font-size="10" fill="#555">  bookRepo) [positional ratings]</text>

<!-- RatingRepository -->
<rect x="360" y="510" width="156" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="360" y="510" width="156" height="22" rx="4" fill="#993C1D"/>
