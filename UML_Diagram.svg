<text x="28" y="566" font-size="10" fill="#555">+ LoadFromFile(path)</text>
<text x="28" y="582" font-size="10" fill="#555">+ Add(book) / GetAll()</text>

<!-- MemberRepository -->
<rect x="186" y="510" width="156" height="80" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
